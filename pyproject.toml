[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-stt"
version = "0.1.0"
description = "Offline, live microphone speech-to-text that writes 10-minute text files and never keeps audio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "soxr>=0.3.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ostt = "offline_stt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
