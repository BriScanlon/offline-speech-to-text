[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-stt"
dynamic = ["version"]
description = "Offline, live microphone speech-to-text that writes 10-minute text files and never keeps audio."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "soxr>=0.3.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ostt = "offline_stt.cli:main"

[tool.setuptools.dynamic]
# Release builds stamp the real version into offline_stt/__init__.py.
version = {attr = "offline_stt.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
