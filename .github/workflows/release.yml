name: Release

# Every merge to main is released: the version is bumped from the highest
# vX.Y.Z tag (patch by default; [minor] or [major] in the PR title for more,
# [skip release] to skip), then the tests run, the MSI is built, and a
# GitHub release is published, which also creates the tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          message="$(git log -1 --format=%B)"
          version="$(python3 packaging/next_version.py "$message" $(git tag --list 'v*'))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then echo "Releasing v$version"; else echo "Skipping release"; fi

  tests:
    needs: version
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/tests.yml

  msi:
    needs: [version, tests]
    uses: ./.github/workflows/build-msi.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: dist
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/*.msi \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
